<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №1 — Реєстрація</title>
    <link rel="stylesheet" href="lab1.css">
</head>
<body>
    
    <main>
        <section>
            <p><a href="index.html#labs" class="back-link">&larr; Повернутися до списку лабораторних занять</a></p>
            
            <h2>Лабораторне заняття №1. Основи HTML</h2>
            <h3>Форма реєстрації користувача</h3>

           
            <form action="https://webhook.site/6b363617-a4ca-4869-9bc0-c80fae8a7278" method="POST" class="registration-form">
                
                <div class="form-group">
                    <label for="first_name">Ім'я:</label>
                    <input type="text" id="first_name" name="first_name" required>
                </div>
                <div class="form-group">
                    <label for="last_name">Прізвище:</label>
                    <input type="text" id="last_name" name="last_name" required>
                </div>
                <div class="form-group">
                    <label for="email">Електронна пошта:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Підтвердження паролю:</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                </div>
                <div class="form-group">
                    <label for="birth_date">Дата народження:</label>
                    <input type="date" id="birth_date" name="birth_date">
                </div>

                <div class="form-group">
                    <label for="gender">Стать:</label>
                    <select id="gender" name="gender">
                        <option value="">-- Оберіть стать --</option>
                        <option value="male">Чоловіча</option>
                        <option value="female">Жіноча</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="submit" value="Зареєструватися" class="submit-btn">
                </div>

            </form>
        </section>
    </main>

</body>
</html>
